name: Architecture

on:
  pull_request:
    paths:
      - "**/*.py"
      - "AGENTS.md"
      - "docs/**"
      - "harness/**"
      - ".gitignore"
      - ".github/workflows/architecture.yml"
  push:
    paths:
      - "**/*.py"
      - "AGENTS.md"
      - "docs/**"
      - "harness/**"
      - ".gitignore"
      - ".github/workflows/architecture.yml"

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare blank local config without overwriting files
        run: python tools/prepare_local_config.py
      - name: Check all version boundaries
        run: >-
          python -m unittest
          test_architecture.py
          test_agent_view.py
          test_review_gate.py
          test_runtime_settings.py
          test_config_templates.py
          -v
      - name: Build synthetic DOM and screenshot
        run: >-
          python tools/build_agent_view.py
          --output-dir .agent-artifacts
          --screenshot
      - name: Upload agent-readable preview
        uses: actions/upload-artifact@v4
        with:
          name: agent-view-quantbot
          path: .agent-artifacts/
          include-hidden-files: true
          if-no-files-found: error
