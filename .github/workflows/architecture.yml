name: Architecture

on:
  pull_request:
    paths:
      - "**/*.py"
      - "AGENTS.md"
      - "docs/**"
      - "harness/**"
      - ".gitignore"
      - ".github/workflows/architecture.yml"
  push:
    paths:
      - "**/*.py"
      - "AGENTS.md"
      - "docs/**"
      - "harness/**"
      - ".gitignore"
      - ".github/workflows/architecture.yml"

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check all version boundaries
        run: python -m unittest test_architecture.py test_review_gate.py -v
